spring.application.name=foodchainx

# Server port
server.port=8081

# Database Connection (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/foodchainx?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Optional explicit dialect if auto-detection fails:
#  spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Logging (SQL traces)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT (required by JwtService)
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=foodchainx
security.jwt.expiration-minutes=60